name: Build, verify and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate source
        run: |
          python -m compileall -q deploy
          bash -n deploy/entrypoint.sh deploy/run-napcat.sh
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dafeiyu:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test and restart persistence
        run: |
          docker run -d --name dafeiyu -p 7860:7860 -v dafeiyu-test:/mnt/workspace -e ASTRBOT_ADMIN_PASSWORD=SmokeTest9Secret -e NAPCAT_WEBUI_TOKEN=SmokeTest9Token -e ONEBOT_TOKEN=SmokeTest9OneBot dafeiyu:test
          python tests/smoke.py
          docker exec dafeiyu sh -c 'echo persistent > /mnt/workspace/probe'
          docker restart dafeiyu
          python tests/smoke.py
          docker exec dafeiyu grep -q persistent /mnt/workspace/probe
      - name: Publish verified image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag dafeiyu:test "$IMAGE:latest"
          docker tag dafeiyu:test "$IMAGE:sha-${GITHUB_SHA:0:12}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA:0:12}"
      - name: Failure diagnostics
        if: failure()
        run: docker logs --tail 180 dafeiyu 2>/dev/null || true
