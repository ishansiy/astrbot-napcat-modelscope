worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_max_body_size 100m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 0.0.0.0:7860;
        server_name _;
        absolute_redirect off;
        location = /healthz {
            proxy_pass http://127.0.0.1:6185/api/auth/setup-status;
        }
        # NapCat's UI supports a native prefix; its own token remains required.
        location = /napcat { return 302 /napcat/webui/; }
        location = /napcat/ { return 302 /napcat/webui/; }
        location ^~ /napcat/ {
            proxy_pass http://127.0.0.1:6099;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://127.0.0.1:6185;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
