user http;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_max_body_size 100m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_host $desktop_host { default $http_x_forwarded_host; '' $http_host; }
    limit_req_zone $binary_remote_addr zone=desktop_login:10m rate=10r/m;
    server {
        listen 0.0.0.0:7860;
        server_name _;
        absolute_redirect off;
        location = /desktop { return 302 /desktop/vnc.html?autoconnect=1&resize=remote&path=%2Fdesktop%2Fwebsockify; }
        location = /desktop/ { return 302 /desktop/vnc.html?autoconnect=1&resize=remote&path=%2Fdesktop%2Fwebsockify; }
        location = /desktop/login {
            limit_req zone=desktop_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:6081;
            proxy_set_header X-Forwarded-Host $desktop_host;
        }
        location = /desktop/logout { proxy_pass http://127.0.0.1:6081; }
        location @desktop_login { return 302 /desktop/login; }
        location = /_desktop_auth {
            internal;
            proxy_pass http://127.0.0.1:6081/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
        location = /desktop/websockify {
            auth_request /_desktop_auth;
            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
        location ^~ /desktop/ {
            auth_request /_desktop_auth;
            error_page 401 = @desktop_login;
            alias /usr/share/novnc/;
            index vnc.html;
        }
        location = /healthz {
            proxy_pass http://127.0.0.1:6185/api/auth/setup-status;
        }
        # NapCat's UI supports a native prefix; its own token remains required.
        location = /napcat { return 302 /napcat/webui/; }
        location = /napcat/ { return 302 /napcat/webui/; }
        location ^~ /napcat/ {
            proxy_pass http://127.0.0.1:6099;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://127.0.0.1:6185;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
