[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/dafeiyu-supervisord.pid
[program:nginx]
command=nginx -g "daemon off;"
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:xvnc]
command=Xvnc :99 -geometry 1440x900 -depth 24 -rfbport 5900 -localhost -SecurityTypes None -AlwaysShared -nolisten tcp -ac
user=desktop
environment=HOME="/home/desktop",XDG_RUNTIME_DIR="/tmp/runtime-desktop"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:astrbot]
command=python main.py
directory=/AstrBot
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:xfce]
command=/bin/bash /opt/dafeiyu/run-desktop.sh
user=desktop
environment=HOME="/home/desktop",DISPLAY=":99",XDG_RUNTIME_DIR="/tmp/runtime-desktop",XDG_CACHE_HOME="/tmp/desktop-cache",XDG_CURRENT_DESKTOP="XFCE",XDG_SESSION_TYPE="x11"
priority=15
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:desktop-auth]
command=python /opt/dafeiyu/desktop_auth.py
priority=4
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:websockify]
command=/opt/astrbot-venv/bin/websockify --heartbeat 30 127.0.0.1:6080 127.0.0.1:5900
priority=18
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:napcat]
command=/bin/bash /opt/dafeiyu/run-napcat.sh
directory=/app/napcat
environment=DISPLAY=":99",HOME="/app",XDG_CONFIG_HOME="/app/.config",LIBGL_ALWAYS_SOFTWARE="1"
priority=30
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
