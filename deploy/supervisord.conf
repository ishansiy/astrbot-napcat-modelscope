[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/dafeiyu-supervisord.pid
[program:nginx]
command=nginx -g "daemon off;"
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:astrbot]
command=python main.py
directory=/AstrBot
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:napcat]
command=/bin/bash /opt/dafeiyu/run-napcat.sh
directory=/app/napcat
environment=DISPLAY=":99",HOME="/app",XDG_CONFIG_HOME="/app/.config",LIBGL_ALWAYS_SOFTWARE="1"
priority=30
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
